name: CI

# Merge gate for the Java host. This workflow does not crawl, does not commit
# catalog files, and does not deploy. The scheduled crawl is daily-collect.yml.
# Paste staging commits are ops-ingest.yml.

on:
  push:
    branches:
      - master
      - phase-a-one-catalog
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Catalog and tree guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Official links are https and private files are not tracked
        run: python3 scripts/ci_guard.py

  domain-collect:
    name: Domain and collect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # install and exec run in one reactor build. A later exec:java process
      # cannot see a domain jar that was only packaged into target/.
      - name: Schema-check the committed catalog
        run: ./mvnw -B --no-transfer-progress -pl collect -am -DskipTests install exec:java -Dexec.args=schema-check

      - name: Verify domain and collect
        run: ./mvnw -B --no-transfer-progress -pl domain,collect -am verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-domain-collect
          if-no-files-found: ignore
          retention-days: 7
          path: |
            domain/target/site/jacoco/
            collect/target/site/jacoco/

  web:
    name: Web tests and boot jar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      student-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govtjobs_students
          POSTGRES_USER: govtjobs
          POSTGRES_PASSWORD: govtjobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govtjobs -d govtjobs_students"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      STUDENT_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/govtjobs_students
      STUDENT_DATABASE_USER: govtjobs
      STUDENT_DATABASE_PASSWORD: govtjobs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Test web
        run: ./mvnw -B --no-transfer-progress -pl web -am test

      # verify would also apply the 80% line gate to web. That gate stays on
      # domain and collect. The web contract is this test run plus a boot jar.
      - name: Package the boot jar
        run: ./mvnw -B --no-transfer-progress -pl web -am package -DskipTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: web-surefire
          retention-days: 7
          path: |
            web/target/surefire-reports/
            domain/target/surefire-reports/
            collect/target/surefire-reports/

      - name: Upload boot jar
        uses: actions/upload-artifact@v5
        with:
          name: web-jar
          if-no-files-found: error
          retention-days: 7
          path: web/target/web-1.0.0-SNAPSHOT.jar

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
