name: Daily collect process alert

# Java daily job: fetch, process when a source returned notices, schema-check,
# alert, then snapshot. GitHub Pages is not the product host.

on:
  schedule:
    # ~06:00 IST
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Install collect
        run: ./mvnw -B --no-transfer-progress -pl collect -am -DskipTests install

      - name: Install Playwright Chromium
        run: ./mvnw -B --no-transfer-progress -pl collect -am -DskipTests exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run daily pipeline
        env:
          PDF_MAX_PER_RUN: "25"
          ALERT_ENABLED: ${{ secrets.ALERT_ENABLED }}
          ALERT_ON_FIRST_RUN: ${{ secrets.ALERT_ON_FIRST_RUN }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: ./mvnw -B --no-transfer-progress -pl collect -am -DskipTests exec:java -Dexec.args=daily

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/staging data/raw/pdfs || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): daily collect $(date -u +%Y-%m-%d)"
            git push
          fi
