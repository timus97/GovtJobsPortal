name: Java collect verify

# Beside the Node daily cron. This job does not fetch sites and does not commit data.
# The scheduled Node workflow stays until a live Java run publishes the same counts.
# After that match, point the cron here and delete client/, server/, and scripts/collect/.

on:
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify domain and collect
        run: ./mvnw -pl domain,collect -am verify
