name: Java collect verify

# Compile and test domain and collect. This job does not fetch sites and does not commit data.
# The scheduled crawl is daily-collect.yml (Temurin 21, the Java daily job).

on:
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify domain and collect
        run: ./mvnw -pl domain,collect -am verify
