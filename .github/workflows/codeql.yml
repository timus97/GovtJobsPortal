name: CodeQL

# Static analysis for the Java sources. Results are uploaded to code scanning.
# This workflow does not deploy.

on:
  push:
    branches:
      - master
      - phase-a-one-catalog
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Setup Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B --no-transfer-progress -pl web -am -DskipTests package

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
