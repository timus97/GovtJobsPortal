# Student desk database. Catalog stays git JSON.
# Start: docker compose up -d student-db
# Schema: Flyway on the Java host (web/src/main/resources/db/migration).
# App:   .\scripts\start-web.ps1 sets STUDENT_DATABASE_URL to the jdbc URL.
services:
  student-db:
    image: postgres:16-alpine
    container_name: govtjobs-student-db
    restart: unless-stopped
    ports:
      # Dev password stays on this machine. Do not publish 5432 on 0.0.0.0.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: govtjobs_students
      POSTGRES_USER: govtjobs
      POSTGRES_PASSWORD: govtjobs
    volumes:
      - student-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govtjobs -d govtjobs_students"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  student-pg-data:
