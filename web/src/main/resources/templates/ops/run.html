<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::title}, ~{::main})}" lang="en">
  <head>
    <title>Review item | Ops</title>
  </head>
  <body>
    <main class="main">
      <div class="section container" th:if="${job == null}"><p>Not found.</p></div>
      <div class="section container" th:unless="${job == null}">
        <p><a class="back-link" href="/ops/review">← Paste review</a></p>
        <p class="error-box" th:if="${notice}" th:text="${notice}"></p>
        <p class="badge" th:text="${publishSentence}">This notice is not on Search yet.</p>
        <p th:if="${!#strings.isEmpty(searchPath)}">
          <a th:href="${searchPath}">Open this notice on Search</a>
        </p>
        <p class="muted" th:text="${job.url}"></p>
        <div class="panel">
          <p>Students can check these facts. Match does not decide eligibility.</p>
          <ul>
            <li th:each="line : ${canCheck}" th:text="${line}">Title: not stated</li>
          </ul>
          <p th:text="${cannotCheck}">Match cannot check age.</p>
          <p th:if="${!leftBlank.isEmpty()}">
            Left blank:
            <span th:text="${#strings.listJoin(leftBlank, ', ')}">summary</span>.
          </p>
        </div>
        <form class="panel" method="post" th:action="@{/ops/runs/{id}(id=${job.id})}">
          <label class="field"><span>Title</span><input name="title" th:value="${job.extracted?.get('title')}" /></label>
          <label class="field"><span>Organisation</span><input name="organization" th:value="${job.extracted?.get('organization')}" /></label>
          <label class="field"><span>Official URL</span><input name="officialUrl" th:value="${job.extracted?.get('officialUrl')}" /></label>
          <label class="field"><span>Last date</span><input name="lastDate" placeholder="YYYY-MM-DD" th:value="${job.extracted?.get('lastDate')}" /></label>
          <label class="field">
            <span>Selection</span>
            <select name="selectionProcess">
              <option value="">Not stated</option>
              <option
                th:each="code : ${selectionCodes}"
                th:value="${code}"
                th:text="${selectionLabel.get(code)}"
                th:selected="${code == job.extracted?.get('selectionProcess')}"
              ></option>
              <option
                th:if="${!#strings.isEmpty(unknownSelection)}"
                th:value="${unknownSelection}"
                th:text="${unknownSelection}"
                selected
              ></option>
            </select>
          </label>
          <label class="field"><span>Summary</span><textarea name="summary" th:text="${job.extracted?.get('summary')}"></textarea></label>
          <label class="field">
            <span>Organisation type</span>
            <select name="orgType">
              <option value="" th:selected="${#strings.isEmpty(job.extracted?.get('orgType'))}">Not stated</option>
              <option
                th:each="code : ${orgTypeCodes}"
                th:value="${code}"
                th:text="${orgTypeLabel.get(code)}"
                th:selected="${code == job.extracted?.get('orgType')}"
              ></option>
              <option
                th:if="${!#strings.isEmpty(unknownOrgType)}"
                th:value="${unknownOrgType}"
                th:text="${unknownOrgType}"
                selected
              ></option>
            </select>
          </label>
          <label class="field">
            <span>Exam</span>
            <select name="hasExam">
              <option value="">Not stated</option>
              <option value="yes" th:selected="${job.extracted?.get('hasExam') == true}">Has an exam</option>
              <option value="no" th:selected="${job.extracted?.get('hasExam') == false}">No written exam</option>
            </select>
          </label>
          <button class="btn btn-secondary" name="action" value="save" type="submit">Save facts</button>
          <button class="btn btn-primary" name="action" value="publish" type="submit">Publish locally</button>
          <button class="btn btn-secondary" name="action" value="unpublish" type="submit" th:if="${flags.unpublish}">Unpublish</button>
          <label class="field"><span>Reject reason</span><input name="reason" /></label>
          <button class="btn btn-secondary" name="action" value="reject" type="submit">Reject</button>
        </form>
      </div>
    </main>
  </body>
</html>
