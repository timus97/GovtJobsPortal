<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">Ops | Sarkari Desk</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/css/collect-desk.css}" />
  </head>
  <body>
    <div class="app-shell theme-admin">
      <header class="site-header admin-header">
        <div class="container header-inner">
          <a href="/ops" class="brand">
            <span class="brand-mark admin-mark" aria-hidden="true"></span>
            <span>
              <strong>Ops</strong>
              <span class="brand-sub">Collectors · review · catalog</span>
            </span>
          </a>
          <nav class="nav" aria-label="Admin">
            <a href="/ops/pipeline" th:class="${nav == 'pipeline'} ? 'nav-link active' : 'nav-link'">Pipeline</a>
            <a href="/ops/pipeline/review" th:class="${nav == 'collect-review'} ? 'nav-link active' : 'nav-link'">Review</a>
            <a href="/ops/pipeline/priority" th:class="${nav == 'priority'} ? 'nav-link active' : 'nav-link'">Priority</a>
            <a href="/ops" th:class="${nav == 'ops'} ? 'nav-link active' : 'nav-link'">Paste</a>
            <a href="/jobs" class="nav-link">Jobs</a>
            <a href="/prepare" class="nav-link">Prepare</a>
            <a href="/ops/logs" th:class="${nav == 'logs'} ? 'nav-link active' : 'nav-link'">Logs</a>
            <span class="role-chip" th:text="${currentEmail}">ops</span>
            <form method="post" th:action="@{/ops/logout}" style="display:inline">
              <button class="nav-link" type="submit">Sign out</button>
            </form>
          </nav>
        </div>
      </header>
      <main class="main" th:replace="${content}"></main>
    </div>
    <script src="/js/collect-progress.js" defer></script>
  </body>
</html>
