<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Student exam desk for Indian government and PSU jobs — match from your profile, search listings, and prepare."
    />
    <title th:replace="${title}">Sarkari Desk</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body>
    <div class="app-shell theme-auth">
      <header class="site-header auth-header">
        <div class="container header-inner">
          <a href="/" class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>
              <strong>Sarkari Desk</strong>
              <span class="brand-sub">Match · search · prepare</span>
            </span>
          </a>
          <nav class="nav" aria-label="Public">
            <a href="/ops/login" class="nav-link nav-link-ops">Admin</a>
          </nav>
        </div>
      </header>
      <main class="main" th:replace="${content}">
        <p>Content</p>
      </main>
      <footer class="site-footer">
        <div class="container footer-inner">
          <p class="muted">
            Aggregator only. Not affiliated with the Government of India or any board or PSU.
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
