<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/student :: layout(~{::title}, ~{::main})}" lang="en">
  <head>
    <title th:text="${item.title} + ' | Desk'">Desk</title>
  </head>
  <body>
    <main class="main">
      <div class="section container desk-detail">
        <p><a class="back-link" href="/dashboard">← Desk</a></p>
        <p class="error-box" th:if="${notice}" th:text="${notice}"></p>
        <header class="panel">
          <div class="badge-row">
            <span class="badge badge-soft" th:text="${item.statusLabel}"></span>
            <span class="badge badge-muted" th:text="${item.kindLabel}"></span>
          </div>
          <h1 th:text="${item.title}">Title</h1>
          <p class="muted" th:text="${item.nextStep}"></p>
          <p th:if="${item.officialUrl != null and #strings.startsWith(#strings.toLowerCase(item.officialUrl), 'https://')}"><a th:href="${item.officialUrl}" target="_blank" rel="noopener noreferrer">Official site</a></p>
        </header>
        <form class="panel" method="post" th:action="@{/desk/{id}(id=${item.id})}">
          <label class="field">
            <span>Status</span>
            <select name="status">
              <option th:each="st : ${deskStatuses}" th:value="${st}" th:text="${deskStatusLabel.get(st)}" th:selected="${item.status == st}"></option>
            </select>
          </label>
          <label class="field"><span>Exam date</span><input type="date" name="examDate" th:value="${item.examDate}" /></label>
          <label class="field"><span>Last / apply date</span><input type="date" name="lastDate" th:value="${item.lastDate}" /></label>
          <label class="field"><span>Notes</span><textarea name="notes" th:text="${item.notes}"></textarea></label>
          <button class="btn btn-primary" type="submit">Save</button>
        </form>
        <section class="panel" th:if="${confirmRemove}">
          <h2>Remove this from your desk?</h2>
          <p>This deletes the desk item and its admit card and result files.</p>
          <form method="post" th:action="@{/desk/{id}(id=${item.id})}">
            <button class="btn btn-primary" type="submit" name="action" value="delete">Remove from desk</button>
          </form>
          <p><a class="btn btn-secondary" th:href="@{/desk/{id}(id=${item.id})}">Cancel</a></p>
        </section>
        <p th:unless="${confirmRemove}"><a th:href="@{/desk/{id}(id=${item.id}, confirm='remove')}">Remove from desk</a></p>
        <div class="desk-file-grid">
          <form class="panel desk-file" method="post" th:action="@{/desk/{id}/files/admit(id=${item.id})}" enctype="multipart/form-data">
            <h2>Admit card</h2>
            <p class="field-hint">PDF, JPEG, or PNG. 5 MB at most.</p>
            <p th:if="${item.hasAdmit}">
              <a th:href="@{/desk/{id}/files/admit(id=${item.id})}">Download admit card</a>
            </p>
            <label class="field"><span>Admit card</span><input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required /></label>
            <button class="btn btn-secondary" type="submit">Upload</button>
          </form>
          <form class="panel" method="post" th:if="${item.hasAdmit}" th:action="@{/desk/{id}/files/admit/delete(id=${item.id})}">
            <button class="btn btn-secondary" type="submit">Remove admit card</button>
          </form>
          <form class="panel desk-file" method="post" th:action="@{/desk/{id}/files/result(id=${item.id})}" enctype="multipart/form-data">
            <h2>Result</h2>
            <p class="field-hint">PDF, JPEG, or PNG. 5 MB at most.</p>
            <p th:if="${item.hasResult}"><a th:href="@{/desk/{id}/files/result(id=${item.id})}">Download result</a></p>
            <label class="field"><span>Result</span><input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required /></label>
            <button class="btn btn-secondary" type="submit">Upload</button>
          </form>
          <form class="panel" method="post" th:if="${item.hasResult}" th:action="@{/desk/{id}/files/result/delete(id=${item.id})}">
            <button class="btn btn-secondary" type="submit">Remove result</button>
          </form>
        </div>

      </div>
    </main>
  </body>
</html>
