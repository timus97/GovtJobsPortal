<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/public :: layout(~{::title}, ~{::main})}"
  lang="en"
>
  <head>
    <title>Ops login | Sarkari Desk</title>
  </head>
  <body>
    <main class="main">
      <div class="container section">
        <p class="eyebrow">Operators</p>
        <form class="panel ops-card ops-login-card" method="post" th:action="@{/ops/login}">
          <h1>Admin console</h1>
          <p class="muted">Individual operator account. This is not a student login.</p>
          <p class="error-box" th:if="${notice}" th:text="${notice}"></p>
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary" type="submit">Sign in</button>
          <p class="muted small" style="margin: 1rem 0 0">
            Candidates use the <a href="/">student sign in</a>.
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
